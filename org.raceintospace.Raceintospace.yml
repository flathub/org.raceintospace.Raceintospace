# vim: sts=4:
app-id: org.raceintospace.Raceintospace
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: raceintospace
rename-desktop-file: raceintospace.desktop

finish-args:
    - --share=ipc
    - --socket=x11
    - --socket=pulseaudio
    - --persist=.raceintospace
    - --device=dri
    # Until support for SDL2, only X11 will work
    #- --socket=wayland
cleanup:
  - /include
  - /lib/cmake
  - /lib/pkgconfig
  - /share/aclocal
  - /share/pixmaps
  - '*.la'
  - '*.a'

modules:
    - shared-modules/SDL/sdl12-compat.json
    - shared-modules/physfs/physfs.json

    - name: jsoncpp
      buildsystem: cmake
      sources:
        - type: git
          url: https://github.com/open-source-parsers/jsoncpp.git
          tag: 1.9.3

    - name: protobuf
      buildsystem: autotools
      sources:
        - type: git
          url: https://github.com/protocolbuffers/protobuf.git
          tag: v3.13.0

    - name: boost
      # Borrowed boost build from https://github.com/flathub/org.kde.digikam
      buildsystem: simple
      build-commands:
        - ./bootstrap.sh --prefix=/app
        - ./b2 --with-headers -j $FLATPAK_BUILDER_N_JOBS
        - ./b2 --with-headers install
      sources:
        - type: archive
          url: https://downloads.sourceforge.net/boost/boost/1.74.0/boost_1_74_0.tar.bz2
          sha256: 83bfc1507731a0906e387fc28b7ef5417d591429e51e788417fe9ff025e116b1

    - name: raceintospace
      buildsystem: cmake
      config-opts:
        - -DCMAKE_POLICY_VERSION_MINIMUM=3.5
      # Icon should be in different place build system puts it, workaround
      # .xpm icons are unsupported
      post-install:
        - install -Dm644 /app/share/pixmaps/raceintospace.png /app/share/icons/hicolor/128x128/apps/org.raceintospace.Raceintospace.png
        - desktop-file-edit --set-key=Icon --set-value=org.raceintospace.Raceintospace /app/share/applications/raceintospace.desktop
      sources:
        - type: git
          url: https://github.com/raceintospace/raceintospace.git
          # Until there is release tag, freeze in time for repeatable builds
          # comment out following for master
          tag: v2.0.0rc1
        - type: patch
          path: appdata.patch

